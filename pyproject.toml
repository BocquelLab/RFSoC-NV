[build-system]
requires = ["setuptools >= 64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rfsoc-nv"
version = "0.1.0"
description = "PC-side client and simulator for the BocquelLab RFSoC4x2 (QICK / qick-dawg) NV setup"
requires-python = ">=3.8"
# qick and qickdawg are installed separately (editable, from the BocquelLab forks, qickdawg with --no-deps):
# listing them here would let pip replace those installs. The PC must run the qick version of the board.
dependencies = ["numpy", "Pyro4"]

[tool.setuptools]
package-dir = {"" = "src_controlleur"}
packages = ["rfsoc_nv"]

[tool.setuptools.package-data]
rfsoc_nv = ["*.json"]
